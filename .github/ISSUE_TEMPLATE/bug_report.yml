name: Bug report
description: Something in MythaBraille is not working
labels: [bug]
body:
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "Windows 11 and Chrome, or an iPhone with Safari" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: What happened, description: "What you did, what you expected, and what happened instead. The text you typed helps if it is not private." }
    validations: { required: true }
  - type: textarea
    id: shots
    attributes: { label: Screenshots, description: "Anything you add here is public." }
